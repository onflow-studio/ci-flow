<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#030507">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='l' x1='0' y1='0' x2='64' y2='0' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%2300e1ff'/%3E%3Cstop offset='1' stop-color='%238c9eff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%23030507'/%3E%3Crect x='7' y='10' width='50' height='44' rx='6' fill='none' stroke='url(%23l)' stroke-width='4'/%3E%3Cpath d='M7 20 H57' stroke='url(%23l)' stroke-width='3'/%3E%3Ccircle cx='15' cy='29' r='3.2' fill='%23e6fbff'/%3E%3Crect x='21' y='26.4' width='20' height='5.2' rx='1' fill='url(%23l)'/%3E%3Ccircle cx='15' cy='38' r='3.2' fill='%23e6fbff'/%3E%3Crect x='21' y='35.4' width='12' height='5.2' rx='1' fill='url(%23l)'/%3E%3Ccircle cx='15' cy='47' r='2.6' fill='none' stroke='%2300e1ff' stroke-width='2'/%3E%3Crect x='21' y='44.4' width='30' height='5.2' rx='1' fill='url(%23l)'/%3E%3C/svg%3E">
<title>ci-flow</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --fg: #c9d1d9;
  --strong: #f0f6fc;
  --dim: #6e7681;
  --line: #30363d;
  --green: #3fb950;
  --yellow: #d29922;
  --red: #f85149;
  --magenta: #bc8cff;
  --cyan: #39c5cf;
  --blue: #58a6ff;
  --on-color: #0d1117;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff;
    --panel: #f6f8fa;
    --fg: #1f2328;
    --strong: #000000;
    --dim: #6e7781;
    --line: #d0d7de;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --magenta: #8250df;
    --cyan: #1b7c83;
    --blue: #0969da;
    --on-color: #ffffff;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.55 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 12px 16px 40px; }

header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
}
.brand { color: var(--magenta); font-weight: 700; }
.host { color: var(--strong); font-weight: 700; }
.badge { padding: 1px 8px; border-radius: 3px; font-weight: 700; color: var(--on-color); }
.badge.ok { background: var(--green); }
.badge.warn { background: var(--yellow); }
.badge.crit { background: var(--red); }
.more { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.spacer { flex: 1; }
.meta { color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
button {
  font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 10px; cursor: pointer;
}
button:hover { border-color: var(--dim); }
.conn::before { content: "● "; }
.conn.live { color: var(--green); }
.conn.down { color: var(--red); }
body.stale main { opacity: .45; }
.banner {
  display: none; margin-top: 10px; padding: 6px 10px; border: 1px solid var(--red);
  color: var(--red); border-radius: 4px;
}
body.lost .banner { display: block; }

section { margin-top: 18px; }
h2 { margin: 0 0 6px; font-size: inherit; color: var(--cyan); font-weight: 700; }
h2::before { content: "▌"; }
h2 .extra { color: var(--dim); font-weight: 400; margin-left: 10px; }
.empty { color: var(--dim); padding-left: 2ch; }

.green { color: var(--green); }
.yellow { color: var(--yellow); }
.red { color: var(--red); }
.magenta { color: var(--magenta); }
.cyan { color: var(--cyan); }
.blue { color: var(--blue); }
.dim { color: var(--dim); }
.b { font-weight: 700; color: var(--strong); }

.bar {
  display: inline-block; position: relative; vertical-align: middle;
  height: .8em; background: var(--line); border-radius: 1px; overflow: hidden;
}
.bar > i { position: absolute; inset: 0 auto 0 0; background: currentColor; }

/* machine */
.machine { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4px 24px; padding-left: 2ch; }
.cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
.cell .k { font-weight: 700; color: var(--strong); width: 4ch; flex: none; }
.cell .bar { flex: 1; min-width: 60px; max-width: 220px; }
.cell .pct { width: 4ch; text-align: right; flex: none; }
.cell .t { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }

/* runners */
.repo-row { display: flex; gap: 6px 14px; align-items: baseline; padding-left: 2ch; margin: 2px 0; }
.repo-row > .name { width: 18ch; flex: none; font-weight: 700; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots { display: flex; flex-wrap: wrap; gap: 4px 14px; min-width: 0; }
.slot { white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; max-width: 34ch; overflow: hidden; }
.slot .n { padding: 0 5px; border-radius: 2px; font-weight: 700; }
.slot.busy .n { background: var(--green); color: var(--on-color); }
.slot.down .n { background: var(--red); color: var(--on-color); }
.slot.idle { color: var(--dim); }
.slot.starting { color: var(--yellow); }
.slot .job { font-weight: 700; color: var(--strong); overflow: hidden; text-overflow: ellipsis; }

/* pipelines */
.group { margin: 8px 0 0 2ch; }
.group > .gh { color: var(--magenta); font-weight: 700; }
.group > .gh .dim { font-weight: 400; margin-left: 8px; }
.run { margin: 6px 0 10px 2ch; }
.runline {
  display: grid; align-items: center; gap: 0 10px;
  grid-template-columns: auto auto 12ch 9ch minmax(0, 1fr) minmax(120px, 240px) 4ch 15ch;
}
.runline.with-repo { grid-template-columns: auto auto 15ch 12ch 9ch minmax(0, 1fr) minmax(120px, 240px) 4ch 15ch; }
.runline > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.runline .bar { width: 100%; }
.runline .pct { text-align: right; }
/* Chips share one fixed line height so running chips (with a bar) line up with
   the rest. The "·" separator hangs in the gap left of each chip; .chips clips
   it for the first chip on every line, so a wrapped line never starts with one. */
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 2ch; margin: 3px 0 0 4ch; overflow: hidden; }
.chip { position: relative; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; height: 1.55em; line-height: 1.55em; }
.chip::before { content: "·"; position: absolute; right: 100%; width: 2ch; text-align: center; color: var(--dim); font-weight: 400; }
.chip.ok { color: var(--green); }
.chip.running { color: var(--yellow); font-weight: 700; }
.chip.running .bar { width: 5ch; }
.chip.running .at { color: var(--dim); font-weight: 400; }
.chip.wait { color: var(--dim); }
.chip.skip { color: var(--dim); opacity: .6; }
.chip.cancel { color: var(--dim); }
.chip.fail > span { line-height: 1.4em; background: var(--red); color: var(--on-color); padding: 0 5px; border-radius: 2px; font-weight: 700; }

/* recent */
.recent { border-collapse: collapse; margin-left: 2ch; }
.recent th { color: var(--dim); font-weight: 400; text-align: left; padding: 0 2ch 2px 0; }
.recent td { padding: 1px 2ch 1px 0; white-space: nowrap; vertical-align: baseline; }
.recent td.name { font-weight: 700; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; }
.recent .strip { letter-spacing: .3ch; }
.recent .wf { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; }
.recent .ago { color: var(--dim); text-align: right; }
.recent .gap { padding-right: 4ch; }
.recent .note { color: var(--dim); }

footer { margin-top: 28px; color: var(--dim); }

@media (max-width: 720px) {
  .wrap { padding: 10px 12px 32px; }
  .recent { display: block; overflow-x: auto; max-width: 100%; margin-left: 0; }
  .machine { grid-template-columns: 1fr; padding-left: 0; }
  .repo-row { flex-direction: column; gap: 2px; padding-left: 0; }
  .repo-row > .name { width: auto; }
  .group, .run { margin-left: 0; }
  .runline, .runline.with-repo {
    grid-template-columns: auto auto 1fr auto;
    grid-template-areas: "icon wf ticket pct" "title title title title" "bar bar bar when";
  }
  .runline .lead { display: none; }
  .runline .icon { grid-area: icon; }
  .runline .repo { display: none; }
  .runline .wf { grid-area: wf; }
  .runline .ticket { grid-area: ticket; }
  .runline .title { grid-area: title; }
  .runline .bar { grid-area: bar; }
  .runline .pct { grid-area: pct; }
  .runline .when { grid-area: when; text-align: right; }
  .runline.with-repo .repo { display: block; grid-area: ticket; }
  .runline.with-repo .ticket { display: none; }
  .chips { margin-left: 0; }
  .strip { width: auto; }
}
</style>
</head>
<body class="stale">
<div class="wrap">
  <header>
    <span class="brand">◆ ci-flow</span>
    <span class="host" id="host">…</span>
    <span id="badge" class="badge warn">CONNECTING</span>
    <span class="more" id="more"></span>
    <span class="spacer"></span>
    <span class="meta">
      <span id="power"></span>
      <span id="uptime"></span>
      <span id="clock"></span>
      <span id="viewer"></span>
      <span id="conn" class="conn down">connecting</span>
      <button id="refresh" type="button" title="Collect now">↻ refresh</button>
    </span>
  </header>
  <div class="banner" id="banner">Disconnected from the collector. Retrying…</div>
  <main id="main"></main>
  <footer>ci-flow · data from the local collector, updated every second</footer>
</div>
<script>
"use strict";

const $ = (id) => document.getElementById(id);

// API URLs are relative so the page works under a path prefix (tailscale serve
// --set-path). A prefix opened without its trailing slash ("/ci") would resolve
// them against the parent, so add the last segment back in that case.
const BASE = /\/(index\.html)?$/.test(location.pathname) ? "" : `${location.pathname.split("/").pop()}/`;
const api = (path) => `${BASE}api/${path}`;

// Build DOM nodes. Strings become text nodes, so GitHub titles can't inject markup.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}

// Turn an element into a link to a GitHub https URL, keeping its class and
// title so it stays the same grid or flex item; anything else stays as is.
function link(url, el) {
  if (typeof url !== "string" || !url.startsWith("https://github.com/")) return el;
  const a = h("a", { href: url, target: "_blank", rel: "noopener" });
  a.className = el.className;
  if (el.title) a.title = el.title;
  a.append(...el.childNodes);
  return a;
}

function ago(s) {
  s = Math.max(0, Math.floor(s));
  const pad = (n) => String(n).padStart(2, "0");
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m${pad(s % 60)}`;
  if (s < 86400) return `${Math.floor(s / 3600)}h${pad(Math.floor(s % 3600 / 60))}`;
  return `${Math.floor(s / 86400)}d${Math.floor(s % 86400 / 3600)}h`;
}

function human(n) {
  for (const u of ["", "K", "M", "G", "T"]) {
    if (Math.abs(n) < 1024 || u === "T") return (u === "" || u === "K" ? n.toFixed(0) : n.toFixed(1)) + u + "B";
    n /= 1024;
  }
}

function levelClass(pct, warn, crit) { return pct >= crit ? "red" : pct >= warn ? "yellow" : "green"; }

function bar(pct, cls) {
  pct = Math.max(0, Math.min(100, pct));
  return h("span", { class: `bar ${cls}` }, h("i", { style: `width:${pct}%` }));
}

const SPARK = "▁▂▃▄▅▆▇█";
function spark(vals) { return vals.map((v) => SPARK[Math.min(7, Math.floor(v / 100 * 7.99))]).join(""); }

// ✓/✗ have no emoji form and U+FE0E asks for the text form of ▶, so the glyphs
// take the CSS colours instead of rendering as grey emoji.
const OK = "\u2713", FAIL = "\u2717", PLAY = "\u25B6\uFE0E";

function runIcon(r) {
  if (r.status === "completed") {
    const m = { success: [OK, "green"], failure: [FAIL, "red"], startup_failure: [FAIL, "red"],
                cancelled: ["⊘", "dim"], skipped: ["»", "dim"] }[r.conclusion] || ["?", "yellow"];
    return h("span", { class: `icon ${m[1]}`, title: r.conclusion || "" }, m[0]);
  }
  if (r.status === "in_progress") return h("span", { class: "icon yellow", title: "running" }, PLAY);
  return h("span", { class: "icon magenta", title: r.status }, "◌");
}

function section(title, extra, ...body) {
  return h("section", {}, h("h2", {}, title, extra ? h("span", { class: "extra" }, extra) : null), ...body);
}

function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }

function jobChip(j) {
  let el;
  if (j.status === "completed") {
    if (j.conclusion === "success") el = h("span", { class: "chip ok" }, `${OK} `, j.label);
    else if (j.conclusion === "failure") el = h("span", { class: "chip fail" }, h("span", {}, `${FAIL} `, j.label));
    else if (j.conclusion === "skipped") el = h("span", { class: "chip skip" }, "» ", j.label);
    else el = h("span", { class: "chip cancel" }, "⊘ ", j.label);
  } else if (j.status === "in_progress") {
    el = h("span", { class: "chip running" }, `${PLAY} `, j.label,
      j.steps_total ? bar(j.steps_done / j.steps_total * 100, "yellow") : null,
      j.slot ? h("span", { class: "at" }, `@${j.slot}`) : null);
  } else {
    el = h("span", { class: "chip wait" }, "◌ ", j.label);
  }
  el.title = `${j.name} — ${j.status === "completed" ? j.conclusion : j.status}`;
  return link(j.url, el);
}

function runLine(r, now, opts) {
  const color = opts.color;
  const when = opts.waiting ? `waiting ${ago(now - (r.created_at || now))}` : ago(now - (r.created_at || now));
  return h("div", { class: `runline${opts.withRepo ? " with-repo" : ""}` },
    h("span", { class: "lead dim" }, opts.lead || ""),
    runIcon(r),
    opts.withRepo ? h("span", { class: "repo b" }, r.name) : null,
    h("span", { class: "wf cyan" }, r.workflow),
    h("span", { class: "ticket blue" }, r.ticket),
    link(r.url, h("span", { class: "title", title: r.title }, r.title)),
    bar(r.pct, color),
    h("span", { class: `pct ${color}` }, `${Math.round(r.pct)}%`),
    h("span", { class: `when ${color}` }, when));
}

function render(snap) {
  const v = snap.view;
  const hs = snap.host;
  const now = snap.ts;
  if (!v) {
    $("main").replaceChildren(h("div", { class: "empty red" }, `The collector couldn't build the view: ${snap.view_error || "unknown error"}`));
    return;
  }

  // Header
  $("host").textContent = snap.hostname;
  const issues = v.health.issues;
  const badge = $("badge");
  badge.className = `badge ${v.health.level}`;
  badge.textContent = issues.length ? `▲ ${issues[0].text.toUpperCase()}` : "● ALL GOOD";
  $("more").replaceChildren(...issues.slice(1).map((i) =>
    h("span", { class: i.level === "crit" ? "red" : "yellow" }, i.text)));
  const power = [];
  if (hs.ac === true) power.push(h("span", {}, "AC"));
  if (hs.ac === false) power.push(h("span", { class: "red b" }, "BATTERY"));
  if (hs.bat != null) power.push(h("span", { class: levelClass(100 - hs.bat, 50, 80) }, ` ${hs.bat}%`));
  $("power").replaceChildren(...power);
  $("uptime").textContent = `up ${ago(hs.uptime)}`;
  $("clock").textContent = new Date(now * 1000).toLocaleTimeString([], { hour12: false });
  document.title = `${issues.length ? "▲ " : ""}ci-flow · ${snap.hostname}`;

  // Machine
  const m = v.machine;
  const meter = (k, pct, warn, crit, tail) => {
    const cls = levelClass(pct, warn, crit);
    return h("div", { class: "cell" }, h("span", { class: "k" }, k), bar(pct, cls),
      h("span", { class: `pct ${cls}` }, `${Math.round(pct)}%`), h("span", { class: "t" }, tail));
  };
  const plain = (k, ...body) => h("div", { class: "cell" }, h("span", { class: "k" }, k), ...body);
  const machine = h("div", { class: "machine" },
    meter("CPU", hs.cpu, 70, 90, spark(hs.cpu_hist.slice(-12))),
    meter("MEM", m.mem_pct, 85, 95, `${human(hs.mem.used)}/${human(hs.mem.total)}`),
    meter("DISK", m.disk_pct, 80, 90, `${human(hs.disk.free)} free`),
    plain("LOAD", h("span", { class: levelClass(m.load_per_core * 100, 100, 200) }, `${m.load_per_core.toFixed(1)}×`),
      h("span", { class: "dim" }, "per core")),
    plain("TEMP", hs.temp ? h("span", { class: levelClass(hs.temp, 85, 95) }, `${Math.round(hs.temp)}°C`)
      : h("span", { class: "dim" }, "-")),
    plain("NET", h("span", {}, h("span", { class: "green" }, "↓"), `${human(hs.net[0])}/s `,
      h("span", { class: "blue" }, "↑"), `${human(hs.net[1])}/s`),
      hs.mem.swap_total ? h("span", { class: "dim" }, `swap ${human(hs.mem.swap_used)}`) : null));

  // Runners
  const c = v.counts;
  const runnersExtra = [`${c.busy}/${c.slots} busy`];
  if (c.jobs_not_started) runnersExtra.push(`${plural(c.jobs_not_started, "job")} not started`);
  if (c.runs_queued) runnersExtra.push(`${plural(c.runs_queued, "run")} queued`);
  const runners = v.slots.map((row) => h("div", { class: "repo-row" },
    h("span", { class: "name", title: row.repo }, row.name),
    h("div", { class: "slots" }, row.slots.map((s) => {
      let body;
      if (s.state === "busy") body = [h("span", { class: "job" }, s.job), h("span", { class: "dim" }, ago(now - (s.started_at || now)))];
      else if (s.state === "down") body = [h("span", { class: "red" }, s.unit || "not installed")];
      else body = [s.state];
      const el = h("span", { class: `slot ${s.state}`, title: `${s.project} runner ${s.n}: ${s.state}` },
        h("span", { class: "n" }, s.n), ...body);
      return s.state === "busy" ? link(s.url, el) : el;
    }))));

  // Running, grouped by repo
  const nRunning = v.running.reduce((n, g) => n + g.runs.length, 0);
  const running = v.running.length ? v.running.map((g) => h("div", { class: "group" },
    h("div", { class: "gh" }, `■ ${g.name}`, h("span", { class: "dim" }, `${g.runs.length} running`)),
    g.runs.map((r) => h("div", { class: "run" },
      runLine(r, now, { color: "yellow" }),
      r.jobs.length ? h("div", { class: "chips" }, r.jobs.map(jobChip)) : null))))
    : [h("div", { class: "empty" }, "nothing running")];

  // Queue
  const queue = v.queue.length ? v.queue.map((r, i) => h("div", { class: "run" },
    runLine(r, now, { color: "magenta", waiting: true, withRepo: true, lead: `${i + 1}.` })))
    : [h("div", { class: "empty" }, "empty")];

  // Recent: one table row per repo, the last run and the last failure in aligned columns.
  const runCells = (r, cls) => r
    ? [h("td", { class: "wf" + (cls ? " " + cls : "") }, link(r.url, h("span", {}, runIcon(r), ` ${r.workflow}`))),
       h("td", { class: "blue" }, r.ticket),
       h("td", { class: "ago gap" }, `${ago(now - (r.updated_at || now))} ago`)]
    : [h("td"), h("td"), h("td", { class: "gap" })];
  const recentRows = v.recent.map((row) => {
    const name = h("td", { class: "name", title: row.repo }, row.name);
    const strip = h("td", { class: "strip" }, row.runs.map((r) => link(r.url, runIcon(r))));
    let note = null;
    if (row.error) note = h("span", { class: "red" }, row.error);
    else if (row.loading) note = "loading…";
    else if (!row.last) note = "no runs";
    if (note) return h("tr", {}, name, strip, h("td", { class: "note", colspan: "6" }, note));
    return h("tr", {}, name, strip, ...runCells(row.last), ...runCells(row.last_fail, "red"));
  });
  const recent = [h("table", { class: "recent" },
    h("thead", {}, h("tr", {}, ...["repo", `last ${v.recent_limit}`, "last run", "", "", "last fail", "", ""]
      .map((t) => h("th", {}, t)))),
    h("tbody", {}, recentRows))];

  $("main").replaceChildren(
    section("MACHINE", null, machine),
    section("RUNNERS", runnersExtra.join(" · "), runners),
    section("RUNNING", plural(nRunning, "pipeline"), running),
    section("QUEUE", `${v.queue.length} waiting · oldest first`, queue),
    section("RECENT", `last ${v.recent_limit} per repo · newest first`, recent));
}

let everConnected = false;

function setLive(live) {
  everConnected = everConnected || live;
  document.body.classList.toggle("stale", !live);
  document.body.classList.toggle("lost", !live && everConnected);
  const conn = $("conn");
  conn.className = `conn ${live ? "live" : "down"}`;
  conn.textContent = live ? "live" : everConnected ? "disconnected" : "connecting";
}

let lastMessage = 0;

function connect() {
  const es = new EventSource(api("events"));
  es.onopen = () => setLive(true);
  es.onmessage = (e) => {
    lastMessage = Date.now();
    try { render(JSON.parse(e.data)); setLive(true); }
    catch (err) { console.error(err); }
  };
  es.onerror = () => {
    setLive(false);
    // EventSource retries network errors by itself but gives up for good on an
    // HTTP error, e.g. a 502 from a proxy while the collector restarts.
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
  };
}

// A stream that is open but silent (stalled proxy, suspended collector) is not live.
setInterval(() => { if (lastMessage && Date.now() - lastMessage > 5000) setLive(false); }, 1000);

$("refresh").addEventListener("click", async () => {
  const btn = $("refresh");
  btn.disabled = true;
  try { await fetch(api("refresh"), { method: "POST" }); } catch (_) { /* shown by the stream state */ }
  setTimeout(() => { btn.disabled = false; }, 1500);
});

fetch(api("whoami")).then((r) => r.json()).then((who) => {
  if (who.login) $("viewer").textContent = who.name ? `${who.name} (${who.login})` : who.login;
}).catch(() => {});

connect();
</script>
